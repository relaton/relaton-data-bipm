name: Crawler

on:
  push:
    # Include v2: this repo's working branch is v2, and without it a push to v2
    # never rebuilds data/ or the two indexes. The cron below still fires only
    # on the repository's default branch, which GitHub fixes for a schedule.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  pull_request:
  schedule:
  - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      args:
        description: Extra args to pass to crawler.rb script
        required: false
        default: ''

jobs:
  crawl:
    uses: relaton/support/.github/workflows/crawler.yml@main
    secrets:
      args: "${{ secrets.RELATON_CI_PAT }}"
