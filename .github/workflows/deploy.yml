name: Deploy

on:
  push:
    # Include v2: many relaton-data-* repos moved their default branch to v2.
    # The reusable data-deploy.yml still gates publication on the repo's actual
    # default branch, so listing all three here is safe for main/master repos.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  pull_request:
  schedule:
  - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  deploy:
    uses: relaton/support/.github/workflows/data-deploy.yml@main
    with:
      # Pilot the relaton-cli index build from GitHub `main`. The default
      # `gem` source installs the latest stable relaton-cli (2.1.x), which
      # predates the `index` command; `git` builds relaton + relaton-cli
      # from source (compiling the frontend). Switch back to the default
      # once a stable relaton-cli with `index` is released.
      source: git
