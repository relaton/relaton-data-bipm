abstract:
- language: en
  script: Latn
  content: |-
    <p>In partnership with Institute of Physics Publishing (IOPP), 
     <em>Metrologia</em> embarks on a new phase of its development with 
    the publication of volume 40. This first issue publishes the 
    proceedings of the NEWRAD 2002 conference. In the past, 
    NEWRAD special issues have typically taken of the order of 
    fifteen months or so from the time of the meeting to appear in 
    print. The fact that in this case the time to publication is less 
    than nine months is testimony to one of the many advantages 
    that IOPP can bring to the publication of the journal, and in 
    the future even shorter times are envisaged.</p><p>Readers will notice that the composition of the Editorial 
    Board has changed. I should like to take this opportunity to 
    thank the outgoing members of the Board for the valuable 
    input they have provided over the years, generously 
    contributing their time and expertise for the advancement of 
    the journal. At the same time I extend a welcome to the new 
    members, confident in the expectation that they will use their 
    wide knowledge and experience to ensure that the high 
    standards of  <em>Metrologia</em> are maintained.</p>
