abstract:
- language: en
  script: Latn
  content: |-
    <p>A comparison of the low-frequency electric field strength in the
    range from 1 V/m to 20 kV/m at frequencies of 16<sup>2</sup>/<sub>3</sub> Hz, 50 Hz,
    60 Hz and 400 Hz was carried out within the scope of
    EUROMET. Eight partners from seven European countries were 
    involved in the comparison; the PTB in Berlin acted as the pilot
    laboratory. Tasks, organization, course, measuring equipment and
    results of the comparison are described. The measuring tasks
    were divided into two parts: the main task at 50 Hz line
    frequency, obligatory for all participants, and the supplementary
    tasks which could be carried out on a voluntary basis. The
    report on hand presents and evaluates the results achieved by
    the participants in the main task. The results of the 
    supplementary tasks will be reported separately.</p>
