abstract:
- language: en
  script: Latn
  content: |-
    <p>Since 1976, 20 national metrology institutes, the BIPM and two other laboratories
    have submitted 58 samples of known activity of  <sup>60</sup>Co to the
    International Reference System (SIR) for activity comparison at the
    Bureau International des Poids et Mesures. The activities ranged from
    about 0.1 MBq to 100 MBq. The degrees of equivalence between each
    equivalent activity measured in the SIR and the key comparison reference
    value (KCRV) have been calculated and the results are given in the form
    of a matrix. A graphical presentation is also given.</p><p>Main text.
    To reach the main text of this paper, click on 
     .
    Note that this text is that which appears in Appendix B of the BIPM
    key comparison database
     .</p><p>The final report has been peer-reviewed and approved for publication
    by Section II of the Consultative Committee for Ionizing Radiation
    (CCRI(II)), comparison identifier BIPM.RI(II)-K1.Co-60, according to the
    provisions of the Mutual Recognition Arrangement (MRA).</p>
