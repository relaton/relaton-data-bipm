abstract:
- language: en
  script: Latn
  content: |-
    <p>The first key comparison in the area of vibration organized under
    the auspices of the Consultative Committee for Acoustics,
    Ultrasound and Vibration (CCAUV) and piloted by the
    Physikalisch-Technische Bundesanstalt (PTB) was carried out
    between January 2000 and June 2001. Twelve national metrology
    institutes (NMIs) from the five regional metrology organizations
    APMP, COOMET, EUROMET, SADCMET and SIM participated. On the
    basis of thorough investigations of amplitude linearity, 
    long-time stability and other performance characteristics, the
    pilot laboratory had selected two different reference
    accelerometers (back-to-back and single-ended) as transfer
    standards.</p><p>
    All NMIs applied laser interferometry in compliance with the
    International Standard ISO 16063-11:1999 for their charge
    sensitivity measurements for the two transfer standards from 40
    Hz to 5 kHz at 22 frequencies (third-octave frequency series)
    with specified uncertainties.</p><p>
    On the basis of the analysis of five different methods for
    computing the key comparison reference value (KCRV) and the
    degrees of equivalence relative to the KCRV, the 'weighted mean
    method' was selected and used.</p><p>
    The results of the CCAUV.V-K1 are a set of KCRVs, their
    uncertainties, and degrees of equivalence of each laboratory
    with respect to the KCRV and between the laboratories. The
    degrees of equivalence computed for the two accelerometers and 
    22 frequencies indicate that the deviations  <em>D</em><sub/> relative to the
    KCRV and the deviations  <em>D</em><sub/> between the laboratories are smaller
    than the relative expanded uncertainty (<em>k</em> = 2) of these
    differences in 96% of all cases for the back-to-back
    accelerometer and in 92% of all cases for the single-ended
    accelerometer. At the reference frequency of 160 Hz, all
    participating laboratories calibrated both transfer standards 
    with a relative expanded uncertainty smaller than  5×10<sup>−3</sup>, which is the limit specified by ISO 16063-11.</p>
