  content: |-
    <p>The influence on gauge block length calibration 
    attributed to changes in atmospheric pressure,  as a result of 
    altitude for example, has been described [1] in
    equation (1).  The estimation established therein considered Young's 
    modulus of elasticity <em>E</em>, which represents normal stress and 
    normal strain per unit length; however, the length correction for 
    pressure on an object in a bath of the atmosphere is more 
    accurately described using the bulk modulus of elasticity <em>K</em>, 
    which represents a volume effect.   The relationship between 
    Young's modulus and the bulk modulus is [2]</p><p>



    </p><p>where <em>K</em> and <em>E</em> are in units of Pa, and σ is Poisson's 
    ratio.  The change in length Δ<em>L</em> of a gauge block of 
    nominal length <em>L</em> by a pressure change of Δ<em>P</em> in Pa, is 
    given by [3, 4]</p><p>



    </p><p>For practical purposes  <em>K</em> = 204 GPa  and σ = 0.33 for steel 
    gauge blocks.</p><p>Acknowledgments 
