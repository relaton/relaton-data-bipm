abstract:
- language: en
  script: Latn
  content: |-
    <p>December 2003 marks the end of an era in the world of metrology with the 
    retirement of Terry Quinn FRS, Director of the BIPM since 1988. Terry's 
    contribution to the field of metrology has been long and distinguished, 
    both as a physicist and administrator; a long list of awards and honours 
    bears testimony to the fact.</p><p>From the standpoint of physics, his contributions have been numerous and 
    important: in the field of thermometry he pioneered the use of cryogenic 
    radiometers, instruments that are now employed as standards by National 
    Metrology Institutes (NMIs) worldwide; his experiments to measure the 
    Newtonian gravitational constant,  <em>G</em>, the least well known of the 
    fundamental constants, are characterized by elegant techniques and novel 
    approaches; and as an example from the field of mass measurement, a 
    definitive experiment at the BIPM ruled out the existence of the so-called 
    'fifth force'.</p><p>As Director of the BIPM, Terry Quinn has been the driving force behind many 
    of the initiatives undertaken in metrology in recent years. As any delegate 
    to conferences or meetings at the BIPM will testify, his knowledge and 
    grasp of complex issues are formidable, abilities that are particularly 
    demonstrated at meetings of the Conférence Générale des Poids et Mesures 
    (CGPM), where many questions of a technical or diplomatic nature are often 
    raised. The signing of the Mutual Recognition Agreement (MRA) at the CGPM 
    in Paris in 1999 by the directors of the NMIs of the industrialized states 
    of the world was largely due to his efforts.</p><p>In paying tribute to Terry, it would be remiss not to mention the part 
    played by his charming wife, Renée. She has graciously hosted innumerable 
    functions at the Quinn home over these years and has always made visitors 
    to the BIPM feel most welcome. On behalf of  <em>Metrologia</em>, its readers 
    and Editorial Board, I take this opportunity to wish the Quinns a long and 
    happy retirement. At the same time our best wishes go to Terry's successor, 
    Professor Andrew Wallard, another highly honoured metrologist, into whose 
    capable hands the Directorship of the BIPM will pass in January 2004.</p><p>Finally, I am delighted to inform readers that starting with Volume 41, the 
    editorial chair will be occupied by Dr Jeffrey Williams. Coming from a 
    distinguished research career in chemical physics and with wide experience 
    in several high-profile posts in the area of publications, Jeffrey is well 
    equipped to expand the horizons of  <em>Metrologia</em> in the post-MRA 
    world. With the knowledge that I leave the journal in safe hands, I wish 
    him every success. From my own part, it has been an exhilarating five and a 
    half years spent at the BIPM, a period I shall always look back on with the 
    greatest of pleasure. I take this opportunity to thank my colleagues here 
    at  <em>Metrologia</em>, the members of the Editorial Board, reviewers, 
    authors and many friends who have contributed in no small measure to make 
    my stay a most enjoyable one.</p>
