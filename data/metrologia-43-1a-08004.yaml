abstract:
- language: en
  script: Latn
  content: |-
    <p>CCQM-K13.1 is a Subsequent Key Comparison 
    for Cadmium and Lead in Sediment
    conducted to provide the opportunity for two NMIs to demonstrate and document
    improvements in measurement capability achieved since the conduct of CCQM-K-13,
    Amount content of Cadmium (Cd) and Lead (Pb) in sediment. 
    The   key
    comparison, completed in 2001, was a successor to CCQM-P15 (Cadmium and Lead content
    in sediment) study, and was performed to demonstrate and document the capability of
    interested National Metrology Institutes to measure Cd and Pb content in a sediment sample.
    The P15, K13 and K13.1 comparisons were activities of the Inorganic Analysis Working
    Group (IAWG) of CCQM. CCQM-P15 and K13 were coordinated by the Institute for
    Reference Materials and Measurements (IRMM, Geel, Belgium) of the Joint Research Centre
    (JRC) of the European Commission. The majority of the participants applied isotope dilution
    mass spectrometry (IDMS) using various mass spectrometry techniques. External standard
    calibration was used by two participants for the Cd measurement and by one participant for
    the Pb measurement.</p><p>Satisfactory agreement of reported results was observed for most participants in CCQM-K13;
    however, two NMIs (CEMAN and PTB) wished to participate in a subsequent Key
    Comparison to demonstrate improved performance of their analytical capabilities. Since
    NIST was in the process of certifying a new marine sediment SRM (2702), and both Cd and
    Pb were going to be determined by the same methods used in CCQM-K13, it was decided to
    use this opportunity to perform a Subsequent Key Comparison (CCQM-K13.1). As NIST had
    successfully participated in both the pilot study and K13, it served as the anchor point to
    which the other participants in the subsequent study could be compared. CENAM signed up
    to determine Cd only in this study, and PTB signed up for both Pb and Cd. The NIST and
    PTB results for Pb exhibited good overlap. However, problems were observed for Cd. The
    NIST and CENAM Cd results did not overlap, and PTB could not report an official result for
    Cd largely due to suspected isobaric interferences.</p><p>Main text.
    To reach the main text of this paper, click on  . Note that this text is that which appears in Appendix B of the BIPM key comparison database  .</p><p>The final report has been peer-reviewed and approved for publication by the
    CCQM, according to the provisions of the CIPM Mutual Recognition Arrangement (MRA).</p>
