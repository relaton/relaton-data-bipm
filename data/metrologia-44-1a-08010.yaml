abstract:
- language: en
  script: Latn
  content: |-
    <p>CCQM-P48 was a Pilot Study of the 
    Inorganic Analysis Working Group of the Comité
    Consultatif pour la Quantité de Matière (CCQM) and was organized by the Institute for
    Reference Materials and Measurements (IRMM) of the European Commission. It was the first
    CCQM comparison dedicated to isotope ratio measurements.</p><p>It involved a rather rare combination of 5 national metrology institutes (NMIs), representing at the
    Comité International des Poids et Mesures (CIPM) 3 Member States of the Metre Convention
    and 2 international organisations, and 10 invited laboratories (5 'nuclear experts', 5
    'geochemistry/mass spectrometry experts') selected outside CIPM. The aim was to compare
    capabilities to measure the  <em>n</em>(<sup>234</sup>U)/<em>n</em>(<sup>238</sup>U),  <em>n</em>(<sup>235</sup>U)/<em>n</em>(<sup>238</sup>U) 
    and  <em>n</em>(<sup>236</sup>U)/<em>n</em>(<sup>238</sup>U) ratios in 4
    simulated biological/environmental materials prepared at a nominal uranium mass fraction of
    5 µg g<sup>-1</sup> (series A) and, optionally, in 4 simulated biological/environmental materials prepared
    at a nominal uranium mass fraction of 5 ng g<sup>-1</sup> (series B). In addition, a diluted solution of 
    IRMM-184, a natural uranium isotopic certified reference material (ICRM), had also been distributed
    for rehearsal as well as for calibration purposes. Participants, however, were free to apply the
    measurement strategy of their choice.</p><p>The test material can be assimilated to a biological/environmental type of sample as the
    matrix simulated approximately the composition of urine, from the combination in ~ 3%
    HNO<sub>3</sub> solution of purified inorganic salt (aquarium seawater salts to 18 ± 2 g kg<sup>-1</sup>) and urea
    (to 17 ± 2 g kg<sup>-1</sup>). Four uranium isotopic mixtures were produced by mixing uranium ICRMs
    in the gas phase as UF<sub>6</sub>. Fractions of these mixtures, following their transformation under the
    form of solid UO<sub>3</sub>, were dissolved individually into ~ 3% HNO<sub>3</sub> to get separate ~ 1000 mg
    uranium kg<sup>-1</sup> mother solutions. Both series of test materials derived from these solutions
    (simple dilution into batches of simulated urine), but participants were not informed about this
    similitude.</p><p>The absolute value of the  <em>n</em>(<sup>235</sup>U)/<em>n</em>(<sup>238</sup>U) ratio in each isotopic mixture was established at the
    earliest stage (i.e. in the gas phase) by calibrated gas source mass spectrometry measurements,
    and thus could serve as independent reference value (expanded,  <em>k</em> = 2, uncertainty  <em>U</em> = 0.05%,
    relative) for results from series A. 'Mixture mode' (MM) median data based on participants'
    results were proposed as consensus reference values for all the other sets of results produced.</p><p>For samples from series A, 6 laboratories implemented a combination of sample digestion and
    matrix separation steps, whereas 3 laboratories did not report any particular sample treatment
    (apart possibly from dilution). Only mass spectrometry was employed for isotope ratio
    measurements, including 9 MC-ICPMS, 3 HR-ICPMS, 2 TIMS and 1 ICP-QMS. For
     <em>n</em>(<sup>235</sup>U)/<em>n</em>(<sup>238</sup>U) ratios, results from 11 laboratories were in agreement within stated  <em>U</em> with
    reference values for at least 3 mixtures; stated relative  <em>U</em> were always &gt; 0.0120% (except for
    1 participant) and always ⩽ 0.7% (except for 1 participant with  <em>U</em> &gt; 1% for 3 samples).
    Results on  <em>n</em>(<sup>234</sup>U)/<em>n</em>(<sup>238</sup>U) ratios were almost always within ± 3% around the calculated MM
    median value. For the  <em>n</em>(<sup>236</sup>U)/<em>n</em>(<sup>238</sup>U) smallest ratio, ~ 5 × 10<sup>-7</sup>, results relative to the
    calculated MM median value were within ± 20% for 8 participants, between 20% and 50%
    above for 3 other participants, over 50% above for 1 participant, and 3 participants did not
    report results. The perception of which factor caused the largest contribution to these
    uncertainty estimations differed among participants because of differences in the analytical
    methodologies deployed but mostly because of wide differences in concepts of uncertainty
    estimation.</p><p>Main text.
    To reach the main text of this paper, click on  .</p><p>The final report has been peer-reviewed and approved for publication by the CCQM IAWG.</p>
