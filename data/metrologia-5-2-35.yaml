abstract:
- language: en
  script: Latn
  content: "<p>The Comité International des Poids et Mesures (CIPM) at\nits meeting in October 1968 agreed to adopt the International\nPractical Temperature Scale of 1968 (IPTS-68) in accordance\nwith the decision of the 13<sup>e</sup> Conférence Générale des Poids\net Mesures, Resolution 8, of October 1967. This resolution gave\nthe CIPM permission to introduce a new Scale to replace the\nexisting IPTS-48 as soon as the Comité Consultatif de Thermométrie (CCT) made its recommendations.</p><p>There were two important reasons for revising the IPTS-48.\nThe first of these was the need to extend the Scale to lower\ntemperatures to achieve a unification of the existing national\nscales in the region 10 K–90 K. Secondly the Scale had not\nbeen revised significantly over the range from −183 °C to\n1063 °C since its inception in 1927, and modern gas thermometer measurements showed that the Scale gave values considerably different from thermodynamic temperatures.</p><p>The CCT agreed on the basic data and methods of interpolation for a new definition of the IPTS at its 8th meeting\nheld in Washington and Ottawa in September 1967. Provision\nwas made to extend the Scale down to 13.81 K, the triple point\nof equilibrium hydrogen, and for the use of the best known\nvalues of thermodynamic temperatures. The value of  <em>c</em><sub>2</sub> used\nin the Planck equation was also revised as a result of a better\nknowledge of the values of fundamental physical constants.</p><p>The CCT appointed a small sub-committee to prepare a text\nof the definition of the IPTS-68 in accordance with its recommendations, with instructions to resolve some points of detail.\nThe final draft of the English text, which is reproduced below,\nreceived the approval of all members of the CCT before it was\nsubmitted to the CIPM. The official text of the IPTS-68 is\nthe French text which was prepared by the Bureau International des Poids et Mesures from the English text, and is\npublished as an annexe to Comptes rendus des séances de la\nTreizième Conférence Générale des Poids et Mesures.</p>"
